<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=outputs/eyewear_brand_review_tool/index.html">
  <title>Glass Review</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Noto Sans KR", sans-serif;

    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    main {
      width: min(560px, 100%);
      background: #fff;
      border: 1px solid #d9ded5;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 12px 36px rgba(20, 24, 20, .08);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.2;
    }
    p {
      margin: 0 0 18px;
      color: #666f65;
      line-height: 1.55;
    }
    a {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      padding: 0 14px;
      border-radius: 6px;
      background: #20251f;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

  <main>
    <h1>Glass Review</h1>
    <p>452 eyewear references across 42 brands. Opening the review tool...</p>
